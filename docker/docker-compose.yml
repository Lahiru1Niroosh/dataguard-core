name: dataguard
services:
  postgres:
    image: postgres:15
    container_name: dataguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dataguard
      POSTGRES_PASSWORD: dataguard_dev_pw
      POSTGRES_DB: dataguard
    ports:
      - "55432:5432"
    volumes:
      - dataguard_pgdata:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql

volumes:
  dataguard_pgdata: